{% extends "base.html" %}
{% block title %}Deposit — Orion Banking{% endblock %}

{% block nav_links %}
  <button onclick="window.location.href='/dashboard'">Overview</button>
  <button class="active" aria-current="page">Deposit</button>
  <button onclick="window.location.href='/transactions'">Transactions</button>
  <button onclick="window.location.href='/transfer'">Transfer</button>
  <button onclick="window.location.href='/beneficiaries'">Beneficiaries</button>
  <button onclick="window.location.href='/settings'">Settings</button>
  <button onclick="window.location.href='/profile'">Profile</button>
  <button onclick="window.location.href='/scheduled-transfers'">Schedules</button>
  <button onclick="window.location.href='/webhooks'">Webhooks</button>
  <button class="danger" data-action="logout">Log out</button>
{% endblock %}

{% block content %}
<div class="page">
  <div class="page-head">
    <div class="who">
      <div class="eyebrow">Move money in</div>
      <h2>Deposit funds</h2>
      <div class="acc">Balance: $<span id="depBalanceShown">0.00</span></div>
    </div>
  </div>
  <div class="section-card">
    <h3>New deposit</h3>
    <p class="sub">Add funds to your Orion Banking account.</p>

    <form id="depositForm" autocomplete="off" novalidate>
      <label>Deposit method</label>
      <div class="method-grid">
        <label><input type="radio" name="depMethod" value="Bank Transfer" checked> Bank Transfer</label>
        <label><input type="radio" name="depMethod" value="Mobile Money"> Mobile Money</label>
        <label><input type="radio" name="depMethod" value="Cash"> Cash</label>
      </div>

      <div class="row2">
        <div>
          <label for="depAmt">Amount (USD)</label>
          <input id="depAmt" type="number" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
        <div>
          <label for="depMemo">Memo (optional)</label>
          <input id="depMemo" type="text" maxlength="500" placeholder="e.g. Paycheck">
        </div>
      </div>

      <button type="submit" class="btn" id="depSubmit">Deposit</button>
      <div class="msg" id="depMsg" role="alert" aria-live="polite"></div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  (function () {
    if (!OrionUI.requireAuth()) return;

    async function loadBalance() {
      try {
        const me = await OrionAPI.me();
        document.getElementById('depBalanceShown').textContent = Number(me.balance).toFixed(2);
      } catch {}
    }

    const form = document.getElementById('depositForm');
    const msg = document.getElementById('depMsg');
    const submit = document.getElementById('depSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      const amt = parseFloat(document.getElementById('depAmt').value);
      const memo = document.getElementById('depMemo').value.trim() || null;
      if (!amt || amt <= 0) {
        msg.className = 'msg err show';
        msg.textContent = 'Amount must be greater than zero.';
        return;
      }
      submit.disabled = true;
      submit.textContent = 'Processing…';
      try {
        const r = await OrionAPI.deposit({ amount: amt, memo });
        if (r && r.reference) {
          msg.className = 'msg ok show';
          msg.textContent = `Deposited $${amt.toFixed(2)} (ref ${r.reference}). New balance: $${Number(r.amount).toFixed(2)}`;
          form.reset();
          loadBalance();
          OrionUI.toast('Deposit complete', 'success', 2500);
        } else {
          msg.className = 'msg err show';
          msg.textContent = r?.error?.message || 'Deposit failed.';
        }
      } catch (err) {
        msg.className = 'msg err show';
        msg.textContent = 'Network error. Please try again.';
      } finally {
        submit.disabled = false;
        submit.textContent = 'Deposit';
      }
    });

    loadBalance();
  })();
</script>
{% endblock %}
