<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Withdrawal confirmed</title></head>
<body style="margin:0;padding:0;background:#0a1220;font-family:'Helvetica Neue',Arial,sans-serif;color:#edeff4;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0a1220;padding:32px 0;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#101b30;border:1px solid #223154;border-radius:14px;overflow:hidden;">
        <tr><td style="padding:24px 32px;border-bottom:1px solid #223154;">
          <div style="font-family:Georgia,serif;letter-spacing:0.16em;text-transform:uppercase;color:#d9727f;font-size:12px;">↑ Withdrawal confirmed</div>
          <h1 style="font-family:Georgia,serif;color:#edeff4;font-size:22px;margin:8px 0 0;">{{ amount }} debited</h1>
        </td></tr>
        <tr><td style="padding:32px;">
          <p style="color:#9aa6bd;font-size:14px;line-height:1.6;">Hi {{ user.full_name }},</p>
          <p style="color:#edeff4;font-size:14px;line-height:1.6;">Your withdrawal of <strong style="color:#d9727f;">{{ amount }}</strong> has been processed.</p>
          <table cellpadding="0" cellspacing="0" style="width:100%;font-size:14px;color:#edeff4;margin-top:16px;">
            <tr><td style="padding:6px 0;color:#9aa6bd;">Reference</td><td style="padding:6px 0;text-align:right;font-family:Monaco,Consolas,monospace;">{{ reference }}</td></tr>
            {% if memo %}<tr><td style="padding:6px 0;color:#9aa6bd;">Memo</td><td style="padding:6px 0;text-align:right;">{{ memo }}</td></tr>{% endif %}
            <tr><td style="padding:6px 0;color:#9aa6bd;">New balance</td><td style="padding:6px 0;text-align:right;font-weight:600;color:#e8b85c;">{{ new_balance }}</td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:16px 32px;border-top:1px solid #223154;">
          <p style="color:#9aa6bd;font-size:11px;margin:0;">— {{ app_name }} · This is an automated message.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
