<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>KYC needs revision</title></head>
<body style="margin:0;padding:0;background:#0a1220;font-family:'Helvetica Neue',Arial,sans-serif;color:#edeff4;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0a1220;padding:32px 0;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#101b30;border:1px solid #223154;border-radius:14px;overflow:hidden;">
        <tr><td style="padding:24px 32px;border-bottom:1px solid #223154;">
          <div style="font-family:Georgia,serif;letter-spacing:0.16em;text-transform:uppercase;color:#d9727f;font-size:12px;">⚠ KYC needs revision</div>
          <h1 style="font-family:Georgia,serif;color:#edeff4;font-size:22px;margin:8px 0 0;">Please review and resubmit</h1>
        </td></tr>
        <tr><td style="padding:32px;">
          <p style="color:#9aa6bd;font-size:14px;line-height:1.6;">Hi {{ user.full_name }},</p>
          <p style="color:#edeff4;font-size:14px;line-height:1.6;">Your KYC submission was reviewed by <strong>{{ reviewed_by }}</strong> and needs revision.</p>
          <div style="background:#0c1526;border:1px solid #223154;border-left:3px solid #d9727f;padding:16px;margin:16px 0;border-radius:6px;">
            <div style="color:#9aa6bd;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Reason</div>
            <div style="color:#edeff4;font-size:14px;line-height:1.6;">{{ reason }}</div>
          </div>
          <p style="color:#9aa6bd;font-size:13px;line-height:1.6;">Please update your information in <strong>Settings → KYC</strong> and resubmit for review.</p>
        </td></tr>
        <tr><td style="padding:16px 32px;border-top:1px solid #223154;">
          <p style="color:#9aa6bd;font-size:11px;margin:0;">— {{ app_name }} · This is an automated message.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
