{% extends "base.html" %}
{% block title %}Users — Admin{% endblock %}

{% block nav_links %}
  <button onclick="window.location.href='/admin'">Dashboard</button>
  <button onclick="window.location.href='/admin/kyc'">KYC Queue</button>
  <button class="active" aria-current="page">Users</button>
  <button onclick="window.location.href='/dashboard'" style="margin-left:24px;">← Customer view</button>
  <button class="danger" data-action="logout">Log out</button>
{% endblock %}

{% block content %}
<div class="page" style="max-width: 960px;">
  <div class="page-head">
    <div class="who">
      <div class="eyebrow">All accounts</div>
      <h2>User management</h2>
      <div class="acc">Search, filter, and manage account lifecycle.</div>
    </div>
  </div>

  <div class="section-card">
    <h3>Filters</h3>
    <div class="filter-row" id="roleFilters">
      <button data-role="" class="active">All</button>
      <button data-role="customer">Customers</button>
      <button data-role="support">Support</button>
      <button data-role="admin">Admins</button>
    </div>
    <input id="searchInput" type="text" placeholder="Search by name, email, or account number…" style="margin-top: 8px;">
  </div>

  <div class="section-card">
    <h3>Results</h3>
    <p class="sub" id="resultsMeta">—</p>
    <ul class="history" id="usersList">
      <li class="skeleton-row" style="display:block;height:48px;"></li>
      <li class="skeleton-row" style="display:block;height:48px;"></li>
    </ul>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  (function () {
    if (!OrionUI.requireAuth('/login')) return;

    let currentRole = '';
    let currentSearch = '';
    let debounceTimer = null;

    async function load() {
      try {
        const me = await OrionAPI.me();
        if (me.role !== 'admin') {
          OrionUI.toast('Admins only.', 'error', 3000);
          setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
          return;
        }
        const params = { skip: 0, limit: 100 };
        if (currentRole) params.role = currentRole;
        if (currentSearch) params.search = currentSearch;
        const items = await OrionAPI.adminListUsers(params);
        render(items);
      } catch (err) {
        OrionUI.toast('Could not load users.', 'error');
      }
    }

    function render(items) {
      const ul = document.getElementById('usersList');
      const meta = document.getElementById('resultsMeta');
      meta.textContent = `${items.length} user${items.length === 1 ? '' : 's'} found.`;
      ul.innerHTML = '';
      if (items.length === 0) {
        ul.innerHTML = `<div class="empty-state"><div class="icon">◇</div><h4>No users match</h4><p>Try a different filter or search.</p></div>`;
        return;
      }
      for (const u of items) {
        const li = document.createElement('li');
        const roleBadge = u.role === 'admin' ? 'danger' : u.role === 'support' ? 'warn' : '';
        const kycBadge = u.kyc_status === 'verified' ? 'success' : u.kyc_status === 'rejected' ? 'danger' : u.kyc_status === 'in_review' ? 'warn' : '';
        li.innerHTML = `
          <span class="dot" style="background: ${u.is_locked ? 'var(--danger)' : 'var(--ice)'};"></span>
          <div style="flex: 1;">
            <strong>${escapeHtml(u.full_name)}</strong> · ${escapeHtml(u.email)}
            <div style="color: var(--text-dim); font-size: 12px;">
              Account ${u.account_number} · ${OrionUI.fmtDateShort(u.created_at)}
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end;">
            <span class="badge ${roleBadge}">${u.role}</span>
            <span class="badge ${kycBadge}">KYC: ${u.kyc_status.replace('_', ' ')}</span>
            ${u.is_locked ? '<span class="badge danger">Locked</span>' : ''}
          </div>`;
        li.style.cursor = 'pointer';
        li.addEventListener('click', () => {
          window.location.href = `/admin/kyc/${u.id}`;
        });
        ul.appendChild(li);
      }
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    document.getElementById('roleFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-role]');
      if (!btn) return;
      document.querySelectorAll('#roleFilters button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentRole = btn.dataset.role;
      load();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        currentSearch = e.target.value.trim();
        load();
      }, 300);
    });

    load();
  })();
</script>
{% endblock %}
