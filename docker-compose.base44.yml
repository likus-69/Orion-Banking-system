# Base44 sandbox stack for Orion Banking (FastAPI + Jinja2 monolith).
#
# Development-only: the app runs from the bind-mounted source tree with the
# uvicorn reloader, so edits show up without rebuilding. Dependencies are
# installed in the image built from Dockerfile.base44 (manifest only).
#
# The database is Postgres — the same engine the repo uses in production — and
# the schema is applied by `alembic upgrade head` in the one-shot `migrate`
# service before the web service starts (README "To run with Postgres").
#
# Usage: docker compose -f docker-compose.base44.yml up -d --build
services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=orion_banking
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion_dev_password
    volumes:
      - orion_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion_banking"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: on-failure

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app/backend
    command:
      - sh
      - -ec
      - exec alembic upgrade head
    volumes:
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=postgresql+psycopg://orion:orion_dev_password@db:5432/orion_banking
      - ENV=dev
      - LOG_LEVEL=INFO
    env_file:
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app/backend
    command:
      - sh
      - -ec
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "3000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - BASE44_PREVIEW_MODE
      - DATABASE_URL=postgresql+psycopg://orion:orion_dev_password@db:5432/orion_banking
      - ENV=dev
      - DEBUG=false
      - LOG_LEVEL=INFO
      - EMAIL_BACKEND=console
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      # Platform-managed secrets (SECRET_KEY). Must stay LAST so dashboard
      # values always win over anything defined above.
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 6
    restart: on-failure

volumes:
  orion_pg:
